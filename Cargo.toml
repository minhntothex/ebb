[package]
name = "ebb"
version = "26.3.0"
edition = "2024"
description = "Minimal macOS Menu Bar monitor for Claude Code, OpenAI Codex, and Antigravity CLI quota"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSRange",
    "NSString",
    "NSThread",
    "NSValue",
] }
objc2-user-notifications = { version = "0.3", features = [
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNUserNotificationCenter",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextAttachment",
    "NSTextField",
    "NSView",
    "NSWorkspace",
    "block2",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
